name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Runs the full suite (decision, pipeline, isolation, contract, perf, e2e).
      # Fails the job on any test failure. No secrets needed — the framework is self-contained.
      - name: Build and test
        run: ./mvnw -B clean package

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: "**/surefire-reports/*"
